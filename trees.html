<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="robots" content="noindex">
  <title>Timber | Mark your trees</title>
  <meta name="description" content="Tap the trees you want felled on a satellite view of your property and text them to Timber.">
  <link rel="icon" href="img/timber-badge.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="style.css">
  <style>
    body { display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; }
    header.site .wrap { padding-top: 10px; padding-bottom: 10px; }
    header.site img { width: 44px; height: 44px; }
    header.site .name { font-size: 22px; }
    .intro { padding: 12px 0 8px; font-size: 16px; }
    .intro h1 { font-size: 22px; margin: 0 0 4px; color: var(--green-dark); }
    .intro p { margin: 0; }
    .find { display: flex; gap: 8px; margin-top: 10px; }
    .find input { flex: 1; min-width: 0; font: inherit; font-size: 16px; padding: 10px 12px; border: 1px solid #b9c7bd; border-radius: 8px; }
    .find button, .pins button, .send { font: inherit; font-weight: 700; border: 0; border-radius: 999px; cursor: pointer; }
    .find button { background: var(--green-dark); color: #fff; padding: 10px 16px; font-size: 16px; }
    #map { flex: 1; min-height: 52vh; width: 100%; background: #1f2a24; }
    .panel { padding: 12px 0 20px; }
    .pins { list-style: none; margin: 0 0 12px; padding: 0; }
    .pins li { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .pins .num { flex: none; width: 30px; height: 30px; border-radius: 50%; background: #e8590c; color: #fff; font-weight: 800; display: grid; place-items: center; font-size: 15px; }
    .pins input { flex: 1; min-width: 0; font: inherit; font-size: 16px; padding: 8px 10px; border: 1px solid #b9c7bd; border-radius: 8px; }
    .pins .note { flex: 1; font-size: 16px; }
    .pins button { flex: none; background: var(--green-light); color: var(--green-dark); padding: 8px 12px; font-size: 14px; }
    .send { display: block; width: 100%; background: var(--green-dark); color: #fff; font-size: 20px; padding: 14px; text-align: center; text-decoration: none; }
    .send[aria-disabled="true"] { opacity: 0.45; pointer-events: none; }
    .hint { font-size: 15px; color: var(--muted); margin: 8px 0 0; }
    .msg { font-size: 15px; color: #b3261e; margin: 6px 0 0; min-height: 1em; }
    .tree-pin { background: #e8590c; color: #fff; border: 3px solid #fff; border-radius: 50%; font-weight: 800; font-size: 15px; display: grid; place-items: center; box-shadow: 0 1px 4px rgba(0,0,0,.6); }
    .leaflet-container { font: inherit; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header class="site">
    <div class="wrap">
      <img src="img/timber-badge.png" alt="Timber logo">
      <div>
        <div class="name">TIMBER</div>
        <div class="tag">Tree felling · Madoc, Ottawa &amp; PEI</div>
      </div>
    </div>
  </header>

  <div class="wrap intro">
    <h1 id="title">Mark your trees</h1>
    <p id="lead">Find your place, then tap each tree you want down. Add a note to each one, then press <b>Send to Timber</b>.</p>
    <form class="find" id="find">
      <input id="addr" type="search" placeholder="Your address" autocomplete="street-address" aria-label="Your address">
      <button type="submit">Find</button>
    </form>
    <p class="msg" id="msg" role="status"></p>
  </div>

  <div id="map" aria-label="Satellite map of the property"></div>

  <div class="wrap panel">
    <ol class="pins" id="pins"></ol>
    <a class="send" id="send" href="#" aria-disabled="true">Send to Timber</a>
    <p class="hint" id="hint">Tip: pinch to zoom in until you can see the trees. Tap a numbered pin to remove it.</p>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script>
    /*
     * Mark your trees: a lead taps the trees they want felled on a satellite view
     * and texts the pins to Timber. Nothing is stored; the pins travel in the text.
     *
     * Link parameters:
     *   a   address shown and searched (e.g. a=1385 Old Carriage Lane, Winchester ON)
     *   ll  map centre "lat,lng" (skips the address search)
     *   n   Timber number to text, 10 digits (default the Ottawa 613 number)
     *   p   pins "lat,lng,note|lat,lng,note" (set by the page when it is sent)
     *   v=1 view mode: shows the pins read-only, for Trevor
     */
    const DEFAULT_NUMBER = '6132094148';
    const params = new URLSearchParams(location.search);
    const viewMode = params.get('v') === '1';
    const number = (params.get('n') || DEFAULT_NUMBER).replace(/\D/g, '').slice(-10);
    let address = params.get('a') || '';
    let pins = [];

    const map = L.map('map', { zoomControl: true, maxZoom: 20 }).setView([45.0, -76.5], 7);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 20, maxNativeZoom: 19,
      attribution: 'Imagery &copy; Esri, Maxar, Earthstar Geographics'
    }).addTo(map);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 20, maxNativeZoom: 19, opacity: 0.6
    }).addTo(map);
    const layer = L.layerGroup().addTo(map);

    const $ = (id) => document.getElementById(id);

    /** Shows a short status line under the address box. */
    function say(text) { $('msg').textContent = text || ''; }

    /** Escapes text for safe insertion into HTML. */
    function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

    /** Builds the numbered orange marker icon for pin number i. */
    function icon(i) {
      return L.divIcon({ className: 'tree-pin', html: String(i), iconSize: [32, 32], iconAnchor: [16, 16] });
    }

    /** Redraws the markers and the pin list from the pins array. */
    function render() {
      layer.clearLayers();
      pins.forEach((p, i) => {
        const m = L.marker([p.lat, p.lng], { icon: icon(i + 1), keyboard: false }).addTo(layer);
        if (viewMode) {
          if (p.note) m.bindTooltip(esc(p.note), { permanent: true, direction: 'right', offset: [16, 0] });
        } else {
          m.on('click', () => { pins.splice(i, 1); render(); });
        }
      });
      $('pins').innerHTML = pins.map((p, i) => viewMode
        ? `<li><span class="num">${i + 1}</span><span class="note">${esc(p.note || '(no note)')}</span></li>`
        : `<li><span class="num">${i + 1}</span><input data-i="${i}" value="${esc(p.note)}" placeholder="Note, e.g. big ash leaning to garage" maxlength="80" aria-label="Note for tree ${i + 1}"><button type="button" data-del="${i}">Remove</button></li>`
      ).join('');
      updateSend();
    }

    /** Encodes the pins for a URL: lat,lng,note joined by "|". */
    function encodePins() {
      return pins.map((p) => `${p.lat.toFixed(6)},${p.lng.toFixed(6)},${p.note.replace(/[|]/g, '/')}`).join('|');
    }

    /** Builds the read-only view link Trevor opens from the text. */
    function viewLink() {
      const u = new URL(location.href.split('?')[0].split('#')[0]);
      u.searchParams.set('v', '1');
      if (address) u.searchParams.set('a', address);
      u.searchParams.set('p', encodePins());
      return u.toString();
    }

    /** Points the Send button at a text to Timber with the notes and the map link. */
    function updateSend() {
      const btn = $('send');
      if (viewMode || !pins.length) { btn.setAttribute('aria-disabled', 'true'); btn.href = '#'; return; }
      const lines = pins.map((p, i) => `${i + 1}) ${p.note || 'tree'}`).join('\n');
      const body = `Hi Trevor, here are the trees I'd like down${address ? ' at ' + address : ''}:\n${lines}\nMap: ${viewLink()}`;
      btn.href = `sms:+1${number}?&body=${encodeURIComponent(body)}`;
      btn.setAttribute('aria-disabled', 'false');
    }

    /** Looks up an address with OpenStreetMap and centres the map on it. */
    async function findAddress(q) {
      if (!q) return;
      say('Finding your place...');
      try {
        const r = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=ca&q=' + encodeURIComponent(q), { headers: { 'Accept-Language': 'en' } });
        const hits = await r.json();
        if (!hits.length) { say('Could not find that address. Try the road and town, or zoom the map to your place.'); return; }
        map.setView([+hits[0].lat, +hits[0].lon], 18);
        say('');
      } catch (e) {
        say('Map search is not working right now. Zoom the map to your place instead.');
      }
    }

    /** Reads pins from the p parameter. */
    function readPins(s) {
      return (s || '').split('|').map((part) => {
        const [lat, lng, ...note] = part.split(',');
        return { lat: +lat, lng: +lng, note: note.join(',') };
      }).filter((p) => isFinite(p.lat) && isFinite(p.lng) && p.lat && p.lng);
    }

    $('pins').addEventListener('input', (e) => {
      const i = e.target.dataset.i;
      if (i !== undefined) { pins[i].note = e.target.value; updateSend(); }
    });
    $('pins').addEventListener('click', (e) => {
      const i = e.target.dataset.del;
      if (i !== undefined) { pins.splice(+i, 1); render(); }
    });
    $('find').addEventListener('submit', (e) => { e.preventDefault(); address = $('addr').value.trim(); findAddress(address); updateSend(); });

    $('addr').value = address;
    if (viewMode) {
      pins = readPins(params.get('p'));
      $('title').textContent = 'Trees marked' + (address ? ': ' + address : '');
      $('lead').textContent = `${pins.length} tree${pins.length === 1 ? '' : 's'} marked by the customer.`;
      $('find').hidden = true;
      $('send').hidden = true;
      $('hint').textContent = 'Satellite imagery can be a few years old; confirm on the site visit.';
      render();
      if (pins.length) map.fitBounds(L.latLngBounds(pins.map((p) => [p.lat, p.lng])).pad(0.6), { maxZoom: 19 });
    } else {
      map.on('click', (e) => {
        if (pins.length >= 12) { say('That is a lot of trees! Send these and text Trevor about the rest.'); return; }
        pins.push({ lat: e.latlng.lat, lng: e.latlng.lng, note: '' });
        render();
        const inputs = $('pins').querySelectorAll('input');
        if (inputs.length) inputs[inputs.length - 1].focus({ preventScroll: true });
      });
      const ll = (params.get('ll') || '').split(',').map(Number);
      if (ll.length === 2 && ll.every(isFinite)) map.setView(ll, 18);
      else if (address) findAddress(address);
      render();
    }
  </script>
</body>
</html>
